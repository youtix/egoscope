reason = "picomatch 2.3.2 and 4.0.7, high: denial of service through a single-branch repeated extglob pattern such as +(*), whose regular expression backtracks exponentially. Development only: ESLint and its plugins, markdownlint-cli2, knip, Vite and Vitest match this repository's own glob patterns with it; a pull request could at worst slow down its own jobs. No release fixes it yet: 4.0.7 is the latest picomatch. A fixed 2.3.x and 4.0.x release would fit the ^2.3.1, ^4.0.4 and ^4.0.7 ranges of the packages that use it."

