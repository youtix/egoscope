reason = "esbuild 0.18.20, moderate: its development server lets any website send it requests and read the answers. Development only and never run: drizzle-kit 0.31.11, its latest stable release, declares @esbuild-kit/esm-loader ^2.5.5 but never loads it, and that loader's @esbuild-kit/core-utils 3.3.2, its last release, pins esbuild ~0.18.20 and would only call its transform functions, never its server. drizzle-kit itself runs esbuild 0.25.12. The fix exists only in esbuild 0.25.0, outside that ~0.18.20 range; a drizzle-kit release without @esbuild-kit/esm-loader removes it."
