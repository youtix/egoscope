# The quality gate's ordinary checks. Every job below must succeed for `ci-ok` to
# pass (see scripts/ci-ok.sh), and `ci-ok` is the one job of this workflow that
# `main` requires: a new job joins the gate by being added to the `needs` list of
# `ci-ok`, which the structure check enforces. The same steps run locally with
# `bun run gate`.
name: CI

on:
  pull_request:
    # No `edited`: an edit of the title or of the description changes no file, and
    # trace.yml checks both texts. A change of the base branch, which GitHub also sends
    # as `edited`, runs nothing here either, since every pull request targets `main`:
    # push, or close and reopen the pull request, to check it against its new base.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Prettier
        run: bun run format:check
      - name: ESLint, markdownlint and structure check
        run: bun run lint
      - name: knip
        run: bun run knip

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned release, checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: TypeScript
        run: bun run typecheck

  # The unit suite, in three shards on three runners at once: Vitest splits the test
  # files by a hash of their path. Each shard writes its results and its coverage
  # into a blob report, and judges no coverage threshold, since it runs only part of
  # the tests of a file (vitest.config.ts): the coverage job does, on the merged
  # reports. A matrix gives ci-ok one result, a success only when every shard
  # succeeded.
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Unit tests of one shard, with coverage
        env:
          SHARD: ${{ matrix.shard }}/3
        run: bun x --no-install vitest run --shard="$SHARD" --coverage --reporter=default --reporter=blob
      # A re-run of one shard uploads its report again, under the same name. The
      # reports are kept one day: a re-run of the coverage job alone a day later finds
      # them gone and fails, so a late re-run re-runs the whole workflow.
      - name: Upload the blob report of the shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The coverage thresholds, judged once on the merged coverage of the three shards,
  # as `bun run test:coverage` judges them on one run of the whole suite. The
  # provider reads the source files and vitest.config.ts, hence the checkout and the
  # dependencies.
  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Download the blob reports of the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-blob-*
          merge-multiple: true
          path: .vitest/blob/
      - name: Coverage thresholds, on the merged reports
        run: bun x --no-install vitest run --merge-reports --coverage

  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: The migrations match the schema and build it from an empty database
        run: bun run db:check

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Next.js production build
        run: bun run build

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [lint, actionlint, typecheck, test, coverage, migrations, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-ok.sh
          sparse-checkout-cone-mode: false
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: sh scripts/ci-ok.sh
