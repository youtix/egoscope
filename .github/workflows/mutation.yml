# Mutation testing of the pure core (CLAUDE.md): Stryker plants one fault at a time
# in src/lib/stats-engine/ and src/lib/ai-exchange/, and their own tests must catch
# every one. The workflow always starts, with no path filter, and its final job,
# `mutation`, always reports a result, because `main` requires it by name. The job
# that runs Stryker finishes at once when nothing in the mutation scope
# (scripts/mutation-scope.ts) differs from its base, and otherwise tests every mutant
# afresh: it keeps no result of an earlier run, which Stryker's incremental mode would
# reuse after a change that it cannot see. The base of a pull request is the base
# branch of its merge commit; the base of a push to main is the last commit of main on
# which this workflow succeeded, since GitHub replaces the pending runs of main when
# several merges land at once, and a replaced run tests nothing. Without such a commit,
# the job tests every mutant (scripts/mutation-gate.ts, scripts/mutation-base.ts).
name: Mutation

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stryker:
    name: stryker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # Lists the successful runs of this workflow on main, the base of a push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for both events: it holds the base branch of a pull
          # request's merge commit and every commit of main, so that the gate can
          # compare with the last one on which this workflow succeeded and check that
          # it is an ancestor of the commit under test.
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      # One step with no condition: the gate chooses the base from the event, and tests
      # every mutant for an event that it does not know.
      - name: Mutation tests from scratch, when the mutation scope changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: bun scripts/mutation-gate.ts --event "$EVENT"
      # Stryker writes its report only when it runs.
      - name: Upload the mutation report (HTML and JSON)
        if: ${{ !cancelled() && hashFiles('reports/mutation/mutation.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  mutation:
    name: mutation
    if: ${{ always() }}
    needs: [stryker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-ok.sh
          sparse-checkout-cone-mode: false
      - name: Require the mutation tests to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: sh scripts/ci-ok.sh
