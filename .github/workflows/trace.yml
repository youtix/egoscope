# The checks that read the pull request's own text, its description and its title, so
# the one check workflow that runs again when either is edited (scripts/workflow-rules.ts).
# Requirement traceability (scripts/trace-requirements.ts): on a pull request, the
# description must have a "Requirements covered" heading, unless the dependency-update
# bot opened the pull request, and each requirement and acceptance criterion listed
# under it must have a test that names it, or a waiver. Whatever the event, every ID
# that a test title cites must exist in the specs and sit in the square brackets that
# the title starts with, the waiver register must hold, and the criteria index must be
# up to date. The title of a pull request, which becomes the squash-merge commit
# subject, must follow Conventional Commits (pr-title). `main` requires the final job,
# `trace`, which passes only when every other job succeeded (scripts/ci-ok.sh).
name: Trace

on:
  pull_request:
    # `edited` checks the claims and the title again when the description or the title
    # changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # An edit of the description cancels nothing: its run waits for the one in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  requirements:
    name: requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      # The requirement status of TRV-79 (scripts/requirement-status.ts), on every run,
      # whatever the checks below find, written to reports/, which git ignores: only the
      # Lot 1 milestone and the final release commit it, with `bun run docs:status --committed`.
      - name: Write the requirement status
        run: bun scripts/requirement-status.ts
      - name: Upload the requirement status
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirement-status
          path: reports/requirement-status.md
          if-no-files-found: error
          retention-days: 14
      # A push has no description, so it claims nothing and runs the other rules only.
      - name: Every cited ID exists, the register holds and the criteria index is up to date
        if: ${{ github.event_name != 'pull_request' }}
        run: bun run trace
      - name: Prove that a description without its heading fails, unless the bot opened the pull request
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          # The same description, without the "Requirements covered" heading, from a
          # contributor, then from the dependency-update bot: the claims check of the next
          # step must refuse the first, naming the heading to add, and pass the second.
          # The grep prints the refusal.
          claims() {
            printf '## Summary\n\nBumps a dependency.\n' | bun run trace --require-claimed --author="$1"
          }
          log="$RUNNER_TEMP/no-heading.log"
          status=0
          claims contributor > "$log" 2>&1 || status=$?
          if [ "$status" -ne 1 ] || ! grep --fixed-strings '## Requirements covered' "$log"; then
            cat "$log"
            echo "::error::The claims check did not refuse a description without its heading (exit code $status)."
            exit 1
          fi
          claims 'dependabot[bot]'
          echo "The claims check refuses a description without its heading, unless the dependency-update bot opened the pull request."
      - name: Every claimed requirement is tested or waived, and every cited ID exists
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # Who opened the pull request, as the event says: the body cannot exempt itself.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: printf '%s\n' "$PR_BODY" | bun run trace --require-claimed --author="$PR_AUTHOR"

  pr-title:
    name: pr-title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bun x --no-install commitlint --verbose

  trace:
    name: trace
    if: ${{ always() }}
    needs: [requirements, pr-title]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-ok.sh
          sparse-checkout-cone-mode: false
      - name: Require every job to succeed (pr-title may be skipped on a push only)
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: sh scripts/ci-ok.sh
