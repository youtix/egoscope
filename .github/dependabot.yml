# Weekly version updates, grouped so that packages that ship together move together.
# The cooldown matches the release-age guard of bunfig.toml (minimumReleaseAge, seven
# days), so Dependabot never proposes a version that `bun install` would refuse; the
# actions get the same guard. Titles follow Conventional Commits, as CI checks.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      major:
        patterns: ['*']
        update-types: [major]
    ignore:
      # The whole build stays on Node.js 22 (.nvmrc, engines.node) until a hardening
      # task at the end of the build moves CI and production to a newer LTS.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    # The workflows, and the composite actions such as setup-project.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
